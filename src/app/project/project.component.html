<section class="page wrap">
  <span class="eyebrow">Selected work</span>
  <h1 class="section-title">Featured <span class="grad-text">projects</span></h1>

  <article class="project glass" *ngFor="let project of projects">
    <div class="media">
      <img [src]="project.currentImage" [alt]="project.title">
      <div class="controls">
        <button (click)="prevImage(project)" aria-label="Previous">&#8592;</button>
        <span>{{ project.currentIndex + 1 }} / {{ project.images.length }}</span>
        <button (click)="nextImage(project)" aria-label="Next">&#8594;</button>
      </div>
    </div>
    <div class="info">
      <h2>{{ project.title }}</h2>
      <p>{{ project.description }}</p>
      <div class="chips"><span class="chip" *ngFor="let t of project.tags">{{ t }}</span></div>
      <a [href]="project.gitLink" target="_blank" rel="noopener" class="btn btn-primary">View on GitHub ↗</a>
    </div>
  </article>
</section>
