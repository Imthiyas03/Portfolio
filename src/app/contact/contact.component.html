<section class="page wrap">
  <div class="layout">
    <div>
      <span class="eyebrow">Contact</span>
      <h1 class="section-title">Let's <span class="grad-text">talk.</span></h1>
      <p class="muted">Have a project, role or idea in mind? Drop a message and I'll get back to you soon.</p>
      <div class="direct">
        <a href="mailto:mohamedimthiyas014@gmail.com" class="glass">✉ mohamedimthiyas014&#64;gmail.com</a>
        <a href="tel:+918124708960" class="glass">☏ +91 8124708960</a>
      </div>
    </div>

    <form class="glass form" (ngSubmit)="onSubmit()" #contactForm="ngForm">
      <div class="row">
        <label>First name<input type="text" name="firstName" [(ngModel)]="form.firstName" required></label>
        <label>Last name<input type="text" name="lastName" [(ngModel)]="form.lastName" required></label>
      </div>
      <label>Email<input type="email" name="email" [(ngModel)]="form.email" required email></label>
      <label>Subject<input type="text" name="subject" [(ngModel)]="form.subject" required></label>
      <label>Message<textarea name="message" [(ngModel)]="form.message" rows="5" required></textarea></label>
      <button type="submit" class="btn btn-primary" [disabled]="contactForm.invalid || sending">{{ sending ? 'Sending…' : 'Send message →' }}</button>
      <p class="status" *ngIf="status" [class.err]="status.startsWith('Error')">{{ status }}</p>
    </form>
  </div>
</section>
